<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 100" width="100%" height="100%">
  <defs>
    <linearGradient id="gradRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B30" />
      <stop offset="50%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <linearGradient id="gradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A2D3A" />
      <stop offset="100%" stop-color="#12131A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hexagonal / Shield Geometric Icon -->
  <g transform="translate(15, 10)">
    <polygon points="40,2 78,22 78,62 40,82 2,62 2,22" fill="url(#gradDark)" stroke="url(#gradRed)" stroke-width="2.5" />
    <!-- Inner Cyber Cuts -->
    <path d="M 22 28 L 58 28 L 50 42 L 32 42 L 28 54 L 46 54 L 40 66 L 18 66 Z" fill="url(#gradRed)" filter="url(#glow)" />
    <!-- Tech Dot -->
    <circle cx="62" cy="58" r="4" fill="#FFFFFF" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(110, 68)">
    <!-- "BLOG" Tag -->
    <text x="0" y="-36" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" letter-spacing="6" fill="#DC2626">PORTAL &amp; CMS</text>
    
    <!-- "FILIPEM2" -->
    <text x="0" y="4" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="1.5" fill="#FFFFFF">
      FILIPE<tspan fill="url(#gradRed)">M2</tspan>
    </text>
  </g>
</svg>
